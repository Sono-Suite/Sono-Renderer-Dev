[package]
name = "renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
